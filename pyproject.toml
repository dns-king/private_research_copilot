[project]
name = "private-research-copilot"
version = "0.1.0"
description = "Fully local Ollama-powered RAG platform for private document research."
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "fastapi>=0.115",
    "httpx>=0.27",
    "langchain-text-splitters>=0.2",
    "markdown>=3.6",
    "numpy>=1.26",
    "psutil>=6.0",
    "pydantic-settings>=2.4",
    "pypdf>=4.3",
    "python-docx>=1.1",
    "python-multipart>=0.0.9",
    "qdrant-client>=1.10",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

